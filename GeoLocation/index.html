<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- How The Geographical Location of user its not hacking its fully allowed from user -->
    <!-- and this is pre programmed in js we need just to use it -->

    
    <script>
        // go to the inspect element console and type :  navigator
        // Navigator is an pre defined object by JavaScript no need to create it 
        // in this navigator there is an information's about the browser that we use
        // inside Navigator we have geolocation 
        // geolocation identify where is the user exactly
        // inside geolocation there is getCurrentPosition this gives me the current position of the user but this geolocation is not available on all devices , because there is old devices there is no gps inside it or maybe new devices but the browser not have this characteristic 
        // so to take the location of the user we need to call the getCurrentPosition from the navigator

        if("geolocation" in navigator){
            //                            this take success call back  , error callback
            navigator.geolocation.getCurrentPosition(getLocation , errorLocation); // we can name this two function what ever we need
        }// when i run the code the browser make a pop up notification to ask if the user want to allow the location or not but i cant change anything in this notification the sentence , its place , buttons , those browser responsible about it

        function getLocation(position){// take some time 
            // console.log(position);// then it return the location this location inside it coordinates latitude and longitude , time stamp (the time that we take the location this time in seconds from 1970 till today "Unix Timestamp 1/1/1970") , we the coords obj latitude and longitude 5tut l toul wel 3ard this coords if we put them on google map or some apps it gives me the location or accuracy this measured in meters
            // console.log("longitude: " + position.coords.longitude);
            // console.log("latitude: " + position.coords.latitude);

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latitude}&lon=${longitude}&format=json`)
            .then(response => response.json())
            .then(location => {
                console.log(location);
            });
        }

        function errorLocation(error){// if we block the popup or there is error
            // console.log(error);
            console.log("Error Getting Location: " + error.message);
        }
    </script>
</body>
</html>
