<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            width: 100px;
            height: 100px;
            background-color: yellow;
            border: 1px solid black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <!-- <button id="testBtn" onclick="sayHi()">Test</button> --> <!--on this way we need to edit on html this is the first way by onclick-->
    <button id="testBtn">Test</button> <!--This way by event listener after click go to inspect element we notice beside the element there is an event-->
    <br><br>
    <div id="container"></div>
    <br><br>
    <input type="password" id="input1" >
    <p id="text"></p>

    <script>
        const testBtn = document.getElementById("testBtn");
        testBtn.addEventListener("click",function (){
            alert('Hi');
        });

        const container = document.getElementById("container");
        container.addEventListener("click",function (){
            console.log("container Clicked!");
        });

        container.addEventListener("mouseover",function (){
            console.log("Mouse Over");
            container.style.backgroundColor = 'red';// this is not hover be careful
        });
        container.addEventListener("mouseout",function (){
            console.log("Mouse Out");
            container.style.backgroundColor = 'yellow';
            // alert("Mouse Out");
        });

        // document.addEventListener("keydown", ()=>{
        //     console.log("Key Down");
        // });
        // document.addEventListener("keyup", ()=>{
        //     console.log("Key Up");
        // });

        const input1 = document.getElementById("input1");
        input1.addEventListener("focus" , function(){
            console.log("Input Focused");// it like click but focus here is better because i can focus on the input by tab or maybe by default the input is autofocus by html attr
        });

        input1.addEventListener("blur" , function(){
            console.log("Input blured");
        });

        input1.addEventListener("change" , function(){
            console.log("Input Changed");
            if(input1.value.length<8){
                document.getElementById("text").innerHTML = "Weak Password";
            }
            else{
                document.getElementById("text").innerHTML = "Strong Password";
            }
        });

        window.addEventListener("resize" , function(){ // if we need to change elements like in media query we change it by eventListener resize we put if on window.screen.width
            console.log("Screen Reside");
            //to know screen size go to inspect type=>   window 
            // in window object we search for window.screen
            //or simply type window.screen.width
        });

        window.addEventListener("scroll" , function(){
            console.log("Screen scrolled");
        });

        window.addEventListener("load" , function(){
            console.log("Loaded");// when i refresh its loud , this happens when the page finish loading , on our local host the loading is fast but in websites it takes some time to load to loud page or images or calling the style sheet if it is on another folder or in iframe its take time when going to the iframe website and loud it 
            //WHEN I USE THIS EVENT LISTENER : WHEN I HAVE A SCRIPT AND I DON'T NEED IT TO WORK BEFORE LOADING THE PAGE I USE THIS EVENT LISTENER
        });

        document.addEventListener("DOMContentLoaded" , function(){
            console.log("DOM Loaded");//DOMContentLoaded loads before load , both works when th page end loading
            //DOMContentLoaded works only for (html elements like div button inputs paragraphs...) parsing on the page.

            //example if we have images the DOMContentLoaded works and end because this event lister nows that here is an img but its not shown because maybe it has big size 5mg until here DOMContentLoaded finished
            // while event listener load not working or finished until all files html css js files fully loaded , so if we have 5mg img loud ev.. wait it to download then finish load or if i have big css file it may take 1 2 seconds to load but DOMContentLoaded don't wait the css file or the img because DOMContentLoaded only works on html

            //Sometimes when we make dom manipulation we need to be careful of this scenario => if there is no input , the script work faster than browser can read the html can make it created so the script it start working and search in the document for an element that have id input and its not found so we have null error
            // best solution to this scenario , for better to put the information above in the DOMContentLoaded eventListener , in meaning i told the browser after you check about all the elements are found and there in the page so now let the code work
            // and its better to write all the scripts inside this event listener
        });
    </script>
</body>
</html>
