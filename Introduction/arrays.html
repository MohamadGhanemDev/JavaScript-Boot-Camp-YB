<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let students = ["Mohammad" , "Ahmad" , "Doureid"];
        console.log(students);
        console.log(students[0]);
        console.log(students[1]);
        console.log(students[2]);

        students[2]= "Fouad";
        console.log(students);
        console.log(students[2]);

        

        for(let i = 0 ; i< students.length ; i++){
            console.log("Student " +  i+1 + ": " + students[i]);//here 1 in concat
        }

        console.log("--------------------------------");

        for(let i = 0 ; i< students.length ; i++){
            console.log("Student " +  (i+1) + ": " + students[i]);//here math done
        }

        console.log("--------------------------------");

        for(let i = 0 ; i< students.length ; i++){
            console.log(i+1  + ": Student " + ": " + students[i]);//here math done
        }

        console.log("--------------------------------");

        //many data type , and no need to give it a size because its dynamic
        let newArray = ["userName"  , 12 , "lastName" , true , false , 13.56];
        console.log(newArray[1]);
        console.log(newArray[3]);
        newArray.pop();// delete last element
        newArray.push("Mohammad");// add at the end
        console.log(newArray);
        newArray.shift();// removes from the beginning
        newArray.unshift("Added")// adds at the beginning
    </script>
</body>
</html>
