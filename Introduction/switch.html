<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let stars = 6;

        switch(stars){
            case 1:
                console.log("Bad");
                break;
            case 2:
                console.log("Not Bad");
                break;
            case 3:
                console.log("Good");
                break;
            case 4:
                console.log("V. Good");
                break;
            case 5:
                console.log("Great");
                break;
            default:
                console.log("Wrong input , you can only rate from 1 to 5 stars");
        }

        let name = "Tony";

        switch(name){
            case "Ahmad":
                console.log("You are the Instructor");
                break;
            case "Mohammad":
                console.log("You are the Student");
                break;
            default:
                console.log("I don't know you...");
        }
    </script>
</body>
</html>
