<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let stars = 10;

        switch(stars){
            case 1:
                console.log("Bad");
                break;
            case 2:
                console.log("Good");
                break;
            case 3:
                console.log("Great");
                break;
            default:
                console.log("Wrong input");
        }
    </script>
</body>
</html>
