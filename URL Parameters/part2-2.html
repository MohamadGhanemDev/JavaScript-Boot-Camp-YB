<html lang="en">
<head>

<body>

    <script>

        
        const vids = [ 
            vid1 = {

                videoName: "trailer1.mp4"
            } ,   
        
            vid2 = {

            }
    ];//array of objects


        // console.log(vids);

        const title = document.getElementById("videoTitle");

        // now go to the browser link , after the link add question mark this means the name of the page is done and now we send parameters

        // go to console and type window

        const urlParams = new URLSearchParams(window.location.search); // its like when we create the object in observer the same object here this is (we make object to class and this class made by js and this object type is URLSearchParams and this object take window.location.search)
        console.log(urlParams); // here if don't add manually in the link this ?id=1&name=Mohammad it give me zero

            const videoId = urlParams.get("id");// no need to take company and name or what ever 
                if(!videoId){

                }// no need to else 

                let currentVid;

                        currentVid = vid;
                    }

                if(!currentVid){

                }

                //until here we have the video that called by the needed id

                title.innerHTML = currentVid.title;
                videoPlayer.src = currentVid.videoName;
                videoDescription.innerHTML = currentVid.description;

    </script>
