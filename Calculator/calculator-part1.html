<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #calculator {
            display: grid;
            grid-template-columns: repeat(4, 90px);
            grid-template-rows: repeat(6, 75px);
        }
        .btn {
            border: 1px solid black;
            background-color: gray;
            font-size: 30px;
            display: grid;
            justify-content: center;
            align-content: center;
        }
        .btn:hover {
            background-color: rgb(156, 156, 156);
        }
        #screen {
            grid-column: 1 / span 4;
            background-color: black;
            border: none;
            color: aliceblue;
            font-size: 50px;
        }
        .two-col {
            grid-column: 1 / span 2;
        }
        .orange {
            background-color: rgb(200, 130, 0);
        }
        .orange:hover {
            background-color: rgb(230, 149, 0);
        }
    </style>
</head>
<body>
    <main id="calculator">
        <input type="text" id="screen" value="0" />
        <div class="btn two-col orange">C</div>
        <div class="btn orange">&larr;</div>
        <div class="btn orange">&divide;</div>
        <div class="btn">7</div>
        <div class="btn">8</div>
        <div class="btn">9</div>
        <div class="btn orange">x</div>
        <div class="btn">4</div>
        <div class="btn">5</div>
        <div class="btn">6</div>
        <div class="btn orange">-</div>
        <div class="btn">1</div>
        <div class="btn">2</div>
        <div class="btn">3</div>
        <div class="btn orange">+</div>
        <div class="btn two-col" onclick="addZero()">0</div>
        <div class="btn">.</div>
        <div class="btn orange">=</div>
    </main>


    <script>
        const screen = document.getElementById("screen");

        function addZero(){
            // screen.value = '0'; //removes old zero and put new zero
            // screen.value += '0';
            screen.value = screen.value + '0';// concat two strings
        }
    </script>
</body>
</html>
